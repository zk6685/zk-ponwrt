name: Release PonWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581
          - an7583

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            pahole uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Vendor custom packages (override feeds with pinned sources)
        run: |
          set -e
          mkdir -p package
          # lucky: gdy666 作者完整版（含 /etc/init.d/lucky 与 /etc/config/lucky，替代 small-package 残缺版）
          git clone --depth=1 https://github.com/gdy666/luci-app-lucky.git /tmp/v-lucky
          rm -rf /tmp/v-lucky/.git
          cp -r /tmp/v-lucky/lucky /tmp/v-lucky/luci-app-lucky package/
          # Airoha NPU 监控: luanmuc 1.2.1（根目录即包，替代索引失败的 rchen14b feed）
          git clone --depth=1 https://github.com/luanmuc/luci-app-airoha-npu.git /tmp/v-npu
          rm -rf /tmp/v-npu/.git
          cp -r /tmp/v-npu package/luci-app-airoha-npu
          # gecoosac 集客 AC: laipeng668（gecoosac 核心 + luci 界面）
          git clone --depth=1 https://github.com/laipeng668/luci-app-gecoosac.git /tmp/v-gco
          rm -rf /tmp/v-gco/.git
          cp -r /tmp/v-gco/gecoosac /tmp/v-gco/luci-app-gecoosac package/
          # openlist2: laipeng668（openlist2 核心 + luci 界面，替代 small-package 版本）
          git clone --depth=1 https://github.com/laipeng668/luci-app-openlist2.git /tmp/v-ol
          rm -rf /tmp/v-ol/.git
          cp -r /tmp/v-ol/openlist2 /tmp/v-ol/luci-app-openlist2 package/
          # dae/daed 新版 2026.09.30：覆盖 immortalwrt packages 旧 daed 1.27.0（修复 eBPF helper 加载失败）
          git clone --depth=1 https://github.com/kenzok8/small-package.git /tmp/v-sp
          rm -rf /tmp/v-sp/.git
          cp -r /tmp/v-sp/dae /tmp/v-sp/daed /tmp/v-sp/luci-app-dae /tmp/v-sp/luci-app-daede package/ 2>/dev/null || true
          # 清理误带进来的 .git / 临时文件
          find package -name '.git' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          echo "Vendored packages:"; ls package

      - name: Drop obsolete miniupnpd patches (fixes upstreamed in 2.3.11)
        run: |
          rm -f feeds/packages/net/miniupnpd/patches/020-descr-filter-fix.patch
          rm -f feeds/packages/net/miniupnpd/patches/030-allow-private-fix.patch
          rm -f feeds/packages/net/miniupnpd/patches/040-improve-logging.patch

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        run: |
          ./scripts/kconfig.pl + + \
            "configs/${{ matrix.target }}.config" \
            configs/release.config \
            configs/zk-apps.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        run: |
          set -o pipefail
          if make -j"$(nproc)" 2>&1 | tee /tmp/world.log; then
            :
          else
            PKG=$(grep -m1 -oE 'ERROR: package/[^ ]+ failed' /tmp/world.log | sed 's/ERROR: //; s/ failed//') || true
            echo "::group::Failed package: ${PKG:-unknown}"
            if [ -n "$PKG" ]; then
              make -j1 V=s "$PKG/compile" 2>&1 | tail -250 || true
            else
              make -j1 V=s 2>&1 | tail -250 || true
            fi
            echo "::endgroup::"
            exit 1
          fi

      - name: Pack ${{ matrix.target }}
        run: |
          mkdir release
          # 固件镜像：target 目录顶层所有文件（排除 packages 子目录与自带 sha256sums）独立上传
          find bin/targets/airoha/${{ matrix.target }} -maxdepth 1 -type f \
            ! -name 'sha256sums' -exec cp {} release/ \;
          # 完整软件源：bin/packages（含全部 feed 插件包 daed/lucky/gecoosac/openlist2 等）
          if [ -d bin/packages ]; then
            tar --zstd -cf "release/ponwrt-${{ matrix.target }}-packages.tar.zst" \
              -C bin packages
          fi

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum * > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"



