name: Release PonWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd pahole

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---- zk6685: Vendor custom packages (沿用原来源) ----
      - name: Vendor custom packages
        run: |
          set -e
          # gdy666/luci-app-lucky -> lucky + luci-app-lucky (full procd init + config)
          git clone --depth=1 https://github.com/gdy666/luci-app-lucky.git /tmp/v-lucky
          cp -r /tmp/v-lucky/lucky package/lucky
          cp -r /tmp/v-lucky/luci-app-lucky package/luci-app-lucky
          # laipeng668/luci-app-gecoosac -> gecoosac + luci-app-gecoosac
          git clone --depth=1 https://github.com/laipeng668/luci-app-gecoosac.git /tmp/v-gecoosac
          cp -r /tmp/v-gecoosac/gecoosac package/gecoosac
          cp -r /tmp/v-gecoosac/luci-app-gecoosac package/luci-app-gecoosac
          # gecoosac Build/Prepare does `cp ../LICENSE`; ensure parent LICENSE exists
          cp /tmp/v-gecoosac/LICENSE package/LICENSE
          # luanmuc/luci-app-airoha-npu (root Makefile, po/ auto i18n)
          git clone --depth=1 https://github.com/luanmuc/luci-app-airoha-npu.git package/luci-app-airoha-npu
          # eamonxg aurora theme + config
          git clone --depth=1 https://github.com/eamonxg/luci-theme-aurora.git package/luci-theme-aurora
          git clone --depth=1 https://github.com/eamonxg/luci-app-aurora-config.git package/luci-app-aurora-config
          # remove feeds same-name packages so vendored versions take effect
          rm -rf feeds/smallpackage/lucky feeds/smallpackage/luci-app-lucky \
                 feeds/smallpackage/luci-app-gecoosac \
                 feeds/smallpackage/dae feeds/smallpackage/daed \
                 feeds/smallpackage/luci-app-dae feeds/smallpackage/luci-app-daede \
                 feeds/smallpackage/daed-next feeds/smallpackage/luci-app-daed-next
          # strip nested .git dirs
          find package/lucky package/luci-app-lucky package/gecoosac package/luci-app-gecoosac \
               package/luci-app-airoha-npu package/luci-theme-aurora package/luci-app-aurora-config \
               -name .git -type d -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}.config" \
            + configs/release.config \
            configs/zk-apps.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        run: |
          make -j2 || {
            echo "=== Build failed, dumping python3 verbose ==="
            make package/feeds/packages/python3/compile V=s -j1
            exit 1
          }

      # ---- zk6685: Pack target image + full packages repo (供后期 apk add) ----
      - name: Pack ${{ matrix.target }}
        run: |
          mkdir release
          # upload firmware images independently + full packages repo for later install
          find bin/targets/airoha/${{ matrix.target }} -maxdepth 1 -type f ! -name 'sha256sums' -exec cp {} release/ \;
          tar --zstd -cf "release/ponwrt-${{ matrix.target }}-packages.tar.zst" \
            -C bin packages \
            -C .. bin/targets/airoha/${{ matrix.target }}/packages
          # zk6685: 文件名加 zk- 前缀 + 日期时间后缀
          TS=$(date +%Y%m%d-%H.%M.%S)
          cd release
          for f in *; do
            base="${f%.*}"
            ext="${f##*.}"
            # 处理 .tar.zst 双扩展名
            if [[ "$f" == *.tar.zst ]]; then
              base="${f%.tar.zst}"
              ext="tar.zst"
            fi
            mv "$f" "zk-${base}-${TS}.${ext}"
          done
          cd ..

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum * > sha256sums

      - name: Compose release body
        run: |
          mkdir -p /tmp/relnotes
          cat > /tmp/relnotes/body.md <<EOF
          ## PonWrt ${{ inputs.tag }}（Airoha AN7581 · build by zk6685）

          - **目标平台**：Airoha AN7581（光猫一体机）
          - **主机名**：DAEPON
          - **内置插件**：iStoreX / iStore 应用商店、Aurora 主题+配置、vlmcsd(KMS)、zram-swap、gecoosac(集客无线AC)、quickfile(网页文件管理)、Airoha-NPU 监控+汉化、htop
          - **软件源内置（后期可 apk add 按需安装）**：dae / daed、openclash、passwall、lucky、openlist、zerotier、tailscale
          - **内核 BTF**：已开 CONFIG_DEBUG_INFO_BTF（dae/daed 免 vmlinux-btf 补包，/sys/kernel/btf/vmlinux 内置）
          - **固件镜像**：各机型独立 .itb（initramfs-recovery / squashfs-sysupgrade），按需选择刷机
          - **软件包仓库**：ponwrt-an7581-packages.tar.zst，含两个源：`packages/aarch64_cortex-a53`（普通插件）+ `targets/airoha/an7581/packages`（kmod 内核模块，如 kmod-sched-bpf/veth/xdp-sockets-diag），离线安装时把两个目录都添加为 apk 源
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
            --notes-file /tmp/relnotes/body.md
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
